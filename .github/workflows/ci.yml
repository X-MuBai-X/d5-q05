name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  # ---------------------------------------------------------------
  # 质量门禁：格式、静态检查、单元测试、覆盖率、竞争检测
  # ---------------------------------------------------------------
  quality:
    name: 质量门禁（gofmt / vet / test / cover / race）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: 缓存模块
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 依赖校验
        run: go mod verify

      - name: 格式检查（gofmt 必须零差异）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::以下文件未格式化："
            echo "$out"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 单元测试与覆盖率采集
        # -coverprofile 必须是**绝对路径**：go test 的测试二进制工作目录是包目录，
        # 相对路径会写包目录下（目录不存在时静默不写），统计脚本就会拿到陈旧剖面。
        run: go test ./... -count=1 -coverprofile="${{ github.workspace }}/coverage.out" -covermode=atomic

      # 覆盖率门禁与本机门禁**共用同一个脚本**（scripts/coverage-summary.py），
      # 避免 CI 与本地各写一份统计逻辑而口径漂移：
      # 本轮就出现过 CI（Linux + go1.27.4）按自带脚本算出 httpapi 84.2% / upstream 83.8%
      # 而本机（Windows + go1.27.1）算出 87.7% / 87.1% 的口径差异。
      - name: 覆盖率门禁（整体与核心包均 ≥85%）
        run: |
          python3 scripts/coverage-summary.py --profile "${{ github.workspace }}/coverage.out" --out evidence/coverage-summary.txt

      - name: 竞争检测（go test -race）
        run: go test ./... -count=1 -race

      - name: 上传覆盖率原件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            evidence/coverage-summary.txt
          if-no-files-found: warn

      - name: 上传测试日志
        if: always()
        run: |
          go test ./... -count=1 -v 2>&1 | tee evidence/ci-test.log || true

  # ---------------------------------------------------------------
  # 业务冒烟：真实启动服务 + 模拟上游，跑通完整业务闭环
  # ---------------------------------------------------------------
  smoke:
    name: 业务冒烟（启动服务并核对配额闭环）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: 启动模拟上游
        run: |
          go build -o /tmp/mockupstream ./cmd/mockupstream
          /tmp/mockupstream -addr 127.0.0.1:9091 > /tmp/mockupstream.log 2>&1 &
          echo $! > /tmp/mockupstream.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9091/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9091/healthz

      - name: 启动服务
        run: |
          go build -o /tmp/server ./cmd/server
          /tmp/server -addr 127.0.0.1:8080 -db /tmp/ci-app.db \
            -upstream http://127.0.0.1:9091 -enable-test-hooks > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz

      - name: 业务冒烟脚本
        run: bash scripts/smoke-test.sh

      - name: 收集日志
        if: always()
        run: |
          {
            echo "=== 模拟上游日志 ==="
            cat /tmp/mockupstream.log || true
            echo "=== 服务日志 ==="
            cat /tmp/server.log || true
          } > evidence/ci-deploy.log

      - name: 上传冒烟证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn

      - name: 停止服务
        if: always()
        run: |
          [ -f /tmp/server.pid ] && kill "$(cat /tmp/server.pid)" || true
          [ -f /tmp/mockupstream.pid ] && kill "$(cat /tmp/mockupstream.pid)" || true
